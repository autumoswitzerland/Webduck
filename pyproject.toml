[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webduck"
version = "1.2.1"
description = "A DuckDB server with REST API and Web UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "autumo GmbH", email = "info@autumo.ch" }
]
keywords = ["duckdb", "database", "server", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "nicegui>=2.0.0",
    "duckdb>=1.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-multipart>=0.0.7",
    "babel>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx2>=0.1.0",
    "ruff>=0.5.0",
]

[project.scripts]
webduck = "webduck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webduck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

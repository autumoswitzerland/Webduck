[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webduck"
version = "1.5.0"
description = "A DuckDB server with REST API and Web UI"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "autumo GmbH", email = "info@autumo.ch" }
]
keywords = [
    "duckdb",
    "database",
    "server",
    "api",
    "analytics",
    "csv",
    "docker",
    "fastapi",
    "json",
    "parquet",
    "rest-api",
    "self-hosted",
    "sql",
    "web-ui",
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "nicegui>=2.0.0",
    "duckdb>=1.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-multipart>=0.0.7",
    "babel>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx2>=0.1.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://webduck.autumo.ch/"
Source = "https://github.com/autumoswitzerland/Webduck"
Tracker = "https://github.com/autumoswitzerland/Webduck/issues"

[project.scripts]
webduck = "webduck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webduck"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

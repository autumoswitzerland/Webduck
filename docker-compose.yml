version: '3.8'

services:
  webduck:
    image: autumo/webduck
    ports:
      - "8998:8998"
    volumes:
      - webduck_data:/data
    environment:
      - WEBDUCK_HOST=0.0.0.0
      - WEBDUCK_PORT=8998
      - WEBDUCK_ADMIN_USER=admin
      - WEBDUCK_ADMIN_PASS=changeme
    restart: unless-stopped

volumes:
  webduck_data:
